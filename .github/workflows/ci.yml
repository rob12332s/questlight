name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, unit tests, build, end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm 10 can crash resolving a fresh tree ("reading 'edgesOut'"); npm 11 fixes it.
      - name: Update npm
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      # Until package-lock.json is committed, keep the resolved lockfile from each run.
      - uses: actions/upload-artifact@v4
        if: hashFiles('package-lock.json') != ''
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 7
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      # A throwaway local Supabase (Postgres + Auth + REST + Realtime) with every
      # migration applied, so end-to-end tests exercise the real backend.
      # Pinned: asking for "latest" needs the GitHub API, which is often rate limited on
      # shared runners. 3.3.0 is the version these tests were last verified with.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.3.0
      - run: supabase --version
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,storage-api
      - name: Point the app at local Supabase
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "E2E_WITH_SUPABASE=1"
            echo "E2E_DB_URL=${DB_URL}"
            # A deterministic stand-in AI, so AI study is tested end to end with no key and no cost.
            echo "AI_PROVIDER=mock"
            echo "AI_ALLOW_MOCK=1"
            # Pro is tested with simulated subscription states only; no payments exist.
            echo "PAYMENTS_TEST_MODE=1"
          } >> "$GITHUB_ENV"
          psql "${DB_URL}" -c "insert into public.private_settings values ('payments_test_mode', 'on')"
      - name: Build (includes type checking)
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (desktop and mobile)
        run: npm run test:e2e
        env:
          E2E_START: production
      # Artifacts are not always reachable, so also print the page snapshots.
      - name: Show failure context
        if: failure()
        run: find test-results -name error-context.md -exec sh -c 'echo "=== $1"; cat "$1"' _ {} \; || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  database:
    name: Database security suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run migrations and security tests on PostgreSQL
        run: |
          export PG_BIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          bash tests/db/run.sh
