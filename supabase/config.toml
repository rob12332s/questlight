# Local Supabase stack, used by CI end-to-end tests (`supabase start`).
# The hosted project is configured in the Supabase dashboard; see docs/SETUP.md.
project_id = "questlight"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Throwaway test accounts only — the hosted project keeps confirmations on.
enable_confirmations = false
